[package]
name = "stowlock"
version = "0.1.0-beta.9"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Drop in a project zip, get a clean, tested GitHub repo, with old versions neatly archived."
repository = "https://github.com/Matt-B-007/StowLock"
readme = "README.md"
keywords = ["github", "git", "zip", "egui", "linux"]
categories = ["development-tools"]

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "wayland", "x11", "accesskit", "default_fonts"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
dirs = "6"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
semver = "1"
regex = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
minisign-verify = "0.3.0"

[dev-dependencies]
egui_kittest = { version = "0.31.1", features = ["eframe"] }
minisign = "0.10.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
