name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: ./target/release/stowlock --self-test

  # The same checks on an up-to-date Arch Linux (close to CachyOS), with the
  # newest git and Rust and git's strictest settings, so problems that only
  # show up on new versions are caught before a release.
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed rust git github-cli base-devel python
      - uses: actions/checkout@v4
      - name: Strict git settings
        run: |
          git config --global safe.bareRepository explicit
          git config --global init.defaultBranch main
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Versions
        run: rustc --version && cargo --version && git --version
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: ./target/release/stowlock --self-test
      - name: Build and install the AUR package (from local files)
        run: |
          useradd -m builder
          VER="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          OUT=/tmp/aurtest
          PKG="$(./packaging/aur/make-pkgbuild.sh "v$VER" target/release/stowlock "$OUT")"
          cp target/release/stowlock "$OUT/stowlock-$VER"
          cp assets/stowlock.svg "$OUT/stowlock-$VER.svg"
          cp LICENSE "$OUT/LICENSE-$VER"
          # Same files and checksums as the release, read from disk instead of GitHub.
          sed -i -E 's#::https://[^"]+"#"#' "$OUT/PKGBUILD"
          chown -R builder "$OUT"
          su builder -c "cd $OUT && makepkg --noconfirm -f"
          pacman -U --noconfirm "$OUT"/*.pkg.tar.zst
          stowlock --version
          test -f /usr/share/applications/stowlock.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/stowlock.svg
          pacman -R --noconfirm "$PKG"

